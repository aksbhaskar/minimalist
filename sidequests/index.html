<style>
  :root { --bg: #fff; --ink: #111; --muted: #888; --line: #ccc; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 18px/1.7 "Newsreader", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14vh 20px 10vh; }
  h1 { font-size: 18px; font-weight: 400; margin: 0; }
  .site { margin: 0 0 48px; }
  p { margin: 0; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-color: var(--ink); }
  .wall { width: min(960px, calc(100vw - 32px)); position: relative; left: 50%; transform: translateX(-50%); }
  .grid { columns: 3; column-gap: 12px; }
  .pair { display: flex; gap: 12px; margin-bottom: 12px; }
  .pair .tile { flex: var(--r) 1 0; margin: 0; }
  .tile.short img { aspect-ratio: 1 / 1; height: auto; object-fit: cover; object-position: var(--pos); }
  .tile { margin: 0 0 12px; break-inside: avoid; opacity: 0; transform: translateY(10px); transition: opacity .6s ease, transform .6s ease; }
  .tile.in { opacity: 1; transform: none; }
  .tile button { display: block; position: relative; width: 100%; padding: 0; border: 0; background: color-mix(in srgb, var(--ink) 6%, var(--bg)); border-radius: 10px; overflow: hidden; cursor: zoom-in; font: inherit; }
  .tile img { display: block; width: 100%; height: auto; transition: transform .5s ease, filter .5s ease; }
  .tile button:hover img, .tile button:focus-visible img { transform: scale(1.035); }
  .tile button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-width: 760px) { .grid { columns: 2; column-gap: 8px; } .tile { margin-bottom: 8px; } .tile button { border-radius: 8px; } .pair { gap: 8px; margin-bottom: 8px; } }
  .lb { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 24px; background: rgba(10,10,10,.92); }
  .lb.open { display: flex; }
  .lb img { max-width: min(1200px, 100%); max-height: calc(100vh - 110px); border-radius: 8px; object-fit: contain; }
  .lb p { color: #888; font-size: 15px; text-align: center; }
  .lb .nav, .lb .close { position: absolute; background: none; border: 0; color: #ccc; font: inherit; cursor: pointer; padding: 12px 16px; }
  .lb .nav { top: 50%; transform: translateY(-50%); font-size: 28px; }
  .lb .prev { left: 4px; } .lb .next { right: 4px; }
  .lb .close { top: 8px; right: 8px; font-size: 16px; }
  .lb .nav:hover, .lb .close:hover { color: #fff; }
  .lb button:focus { outline: none; }
  .lb button:focus-visible { outline: 1px solid #777; outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { .tile, .tile img { transition: none; } .tile { opacity: 1; transform: none; } }
</style>
</head>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="close" type="button" aria-label="Close">close</button>
  <button class="nav prev" type="button" aria-label="Previous photo">&larr;</button>
  <img alt="">
  <p></p>
  <button class="nav next" type="button" aria-label="Next photo">&rarr;</button>
</div>
<script>
  (function () {
    var tiles = [].slice.call(document.querySelectorAll(".tile")), lb = document.getElementById("lb");
    var big = lb.querySelector("img"), cap = lb.querySelector("p"), at = 0, opener = null;
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
      }, { rootMargin: "0px 0px -40px 0px" });
      tiles.forEach(function (t) { io.observe(t); });
    } else tiles.forEach(function (t) { t.classList.add("in"); });

    function show(i) {
      at = (i + tiles.length) % tiles.length;
      var img = tiles[at].querySelector("img");
      big.src = img.src; big.alt = img.alt;
      cap.textContent = (at + 1) + " / " + tiles.length;
    }
    function open(i, from) { opener = from; show(i); lb.classList.add("open"); document.body.style.overflow = "hidden"; lb.querySelector(".close").focus(); }
    function close() { lb.classList.remove("open"); document.body.style.overflow = ""; if (opener) opener.focus(); }
    tiles.forEach(function (t, i) { t.querySelector("button").addEventListener("click", function () { open(i, this); }); });
    lb.querySelector(".close").addEventListener("click", close);
    lb.querySelector(".prev").addEventListener("click", function () { show(at - 1); });
    lb.querySelector(".next").addEventListener("click", function () { show(at + 1); });
    lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
    document.addEventListener("keydown", function (e) {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") close();
      else if (e.key === "ArrowLeft") show(at - 1);
      else if (e.key === "ArrowRight") show(at + 1);
    });
    var sx = null;
    lb.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener("touchend", function (e) {
      if (sx === null) return;
      var dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1));
    });
  })();
</script>
