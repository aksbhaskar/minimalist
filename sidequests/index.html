<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side Quests · Akshat Bhaskar</title>
<meta name="description" content="Side quests: photos and moments from Akshat Bhaskar.">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; --ink: #111; --muted: #888; --line: #ccc; }
  :root[data-theme="dark"] { --bg: #111; --ink: #e6e6e6; --muted: #7a7a7a; --line: #444; color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 18px/1.7 "Newsreader", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14vh 20px 10vh; }
  h1 { font-size: 18px; font-weight: 400; margin: 0; }
  .site { margin: 0 0 48px; }
  p { margin: 0; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-color: var(--ink); }
  .photos { display: grid; gap: 18px; }
  .photos img { display: block; width: 100%; height: auto; border-radius: 2px; }
  .theme { position: absolute; top: 20px; right: 20px; background: none; border: 0; padding: 0; font: inherit; font-size: 15px; color: var(--muted); cursor: pointer; }
  .theme:hover { color: var(--ink); }
</style>
</head>
<body>
<button class="theme" id="theme" type="button">Dark</button>
<main>
  <h1>Side Quests</h1>
  <p class="site"><a href="../">Akshat Bhaskar</a></p>

  <div class="photos">
    <img src="images/1.webp" width="1600" height="1067" alt="Students felicitated by the President of India at Rashtrapati Bhavan" loading="eager">
    <img src="images/2.webp" width="1170" height="878" alt="Snow-capped mountain behind pine trees" loading="lazy">
    <img src="images/3.webp" width="1200" height="684" alt="Discussion around a whiteboard of equations" loading="lazy">
    <img src="images/4.webp" width="1600" height="1200" alt="A pigeon taking off over a still lake" loading="lazy">
    <img src="images/5.webp" width="1280" height="568" alt="Presenting a proof of Euler's criterion on a whiteboard" loading="lazy">
    <img src="images/6.webp" width="1600" height="1067" alt="Yaks grazing below a mountain in the high Himalayas" loading="lazy">
    <img src="images/7.webp" width="303" height="220" alt="With Nobel laureate Sir Paul Nurse" loading="lazy">
    <img src="images/8.webp" width="1600" height="1200" alt="Plaque marking Vinayak Damodar Savarkar's cell at the Cellular Jail" loading="lazy">
    <img src="images/9.webp" width="1600" height="1200" alt="Paintings in the Cellular Jail gallery" loading="lazy">
    <img src="images/10.webp" width="1080" height="1080" alt="Scuba diving underwater" loading="lazy">
  </div>
</main>
<script>
  (function () {
    var root = document.documentElement, btn = document.getElementById("theme");
    function isDark() { return root.getAttribute("data-theme") === "dark"; }
    function label() { btn.textContent = isDark() ? "Light" : "Dark"; }
    btn.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      label();
    });
    label();
  })();
</script>
</body>
</html>
